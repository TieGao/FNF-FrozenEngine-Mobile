name: Mobile + Release

# 按主版 main-release.yml 的流程重做：矩阵 -> build.yml(干净复用) -> Releaser -> extra-content。
# 与主版的结构性差异：矩阵以移动端两条（Android / iOS）为主，另加一条 Windows ARM64
# （Win-on-ARM 平板 / 二合一用；x64 包在这些机器上要么装不上要么跑成 x86 模拟）。
#
# exclude_extra 语义：
#   - 移动端：apk / ipa 在编译阶段就已成型，无法像桌面那样"打包后再删"，改用编译期开关 ——
#     Project.xml 里 content/VanillaSongs 四类资源已由 BASE_GAME_* 宏条件打包，这里传：
#         -D NO_BASE_GAME_ERECT_CONTENT -D NO_BASE_GAME_PICO -D NO_BASE_GAME_BF -D NO_BASE_GAME_COLLAB
#     剔的是"数据"而不是代码：Erect 的 9 个 *Erect.hx 舞台类由 BASE_GAME_ERECT 把关，
#     不受 NO_BASE_GAME_ERECT_CONTENT 影响 —— 无论开关怎么传，Erect 舞台代码都会被编译进包。
#   - 需要连舞台类也一起剔掉时，才额外传 -D NO_EXTRA_BASE_GAME。
#
# 额外内容数据另外由 extra-content.yml 以独立 zip 形式挂在同一个 release 上。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发版 tag（留空 = devbuild-<commit-hash>；填了就整套流程都用它，可复用已存在的 tag）'
        required: false
        type: string
        default: ''
      exclude_extra:
        description: '基础包剔除额外内容数据（content/VanillaSongs 四类，另行由 extra-content.yml 打包）'
        type: boolean
        default: false

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: FrozenEngine
  REPO_PATH: TieGao/FNF-FrozenEngine-Mobile

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
    steps:
      - name: Check Repository
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "REPO_PATH: ${{ env.REPO_PATH }}"
          if [[ "$GITHUB_REPOSITORY" != "${{ env.REPO_PATH }}" ]]; then
            echo "Doesn't seem to be correct, returning SIGABRT..."
            exit 6
          else
            echo "Seems to be correct..."
          fi

      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "Latest commit hash is $commit_hash"
          echo "COMMIT_HASH=$commit_hash" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    strategy:
      fail-fast: false
      matrix:
        include:
          # ================= Android =================
          - name: Android
            os: macos-latest
            buildArgs: "android -final"
            noExtraArgs: "-D NO_BASE_GAME_ERECT_CONTENT -D NO_BASE_GAME_PICO -D NO_BASE_GAME_BF -D NO_BASE_GAME_COLLAB"
            setupCommand: sh ./setup/unix.sh
            artifactName: androidBuild
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"

          # ================= iOS =================
          - name: iOS
            os: macos-latest
            buildArgs: "ios -final -nosign"
            noExtraArgs: "-D NO_BASE_GAME_ERECT_CONTENT -D NO_BASE_GAME_PICO -D NO_BASE_GAME_BF -D NO_BASE_GAME_COLLAB"
            setupCommand: sh ./setup/unix.sh
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"

          # ================= Windows ARM64 =================
          # arm64 原生包，走与仓库里 windows-arm64-build.yml 同一条路：
          # lime 用 TieGao/lime 库形态（自带 WindowsArm64 预编译 ndll 与已带 arm64
          # 支持的工具），hxcpp 用 TieGao fork（自带 WindowsArm64 工具链），
          # hxvlc / linc_luajit 均有 arm64 二进制。windows-latest 的 VS2022 自带
          # MSVC ARM64 生成工具，无需额外安装。
          # 产物目录结构与 x64 一致（export/release/windows/bin），只是 ndll 换 arm64。
          - name: Windows ARM64
            os: windows-latest
            buildArgs: "windows -arm64 -D HXCPP_ARM64"
            noExtraArgs: "-D NO_BASE_GAME_ERECT_CONTENT -D NO_BASE_GAME_PICO -D NO_BASE_GAME_BF -D NO_BASE_GAME_COLLAB"
            setupCommand: .\"setup/windows.bat"
            artifactName: windowsBuild-arm64
            artifactPath: export\release\windows\bin\*
    uses: ./.github/workflows/build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        setupCommand: ${{ matrix.setupCommand }}
        buildArgs: ${{ inputs.exclude_extra && format('{0} {1}', matrix.buildArgs, matrix.noExtraArgs) || matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}

  Releaser:
    needs: [get-commit-hash, build]
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      # 发版前先定死 tag：workflow_dispatch 填了 inputs.tag 就用它（能直接复用已存在的
      # tag，比如补发 extra-content），留空则回落到 devbuild-<commit-hash>。
      # 下游 extra-content 统一引用本 job 的 outputs.tag —— 之前它虽然 needs: Releaser，
      # 却去引用 needs.get-commit-hash.outputs.commit_hash，而 get-commit-hash 不在它的
      # needs 里，表达式求值为空，tag 被拼成 "devbuild-"，checkout 直接失败。
      - name: Resolve release tag
        id: resolve_tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          fi
          name="${{ inputs.tag }}"
          if [ -z "$name" ]; then
            name="DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          fi
          echo "Release tag:  $tag"
          echo "Release name: $name"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # ---------------- Android ----------------
      - name: Download Android Build
        uses: actions/download-artifact@main
        with:
           name: androidBuild
           path: /home/runner

      - name: Move Android File
        run: mv /home/runner/${{ env.PROJECT_NAME }}-release.apk /home/runner/${{ env.PROJECT_NAME }}-Android.apk

      # ---------------- iOS ----------------
      - name: Download iOS Build
        uses: actions/download-artifact@main
        with:
           name: iOSBuild
           path: ${{ github.workspace }}

      - name: Move iOS File
        run: mv ${{ github.workspace }}/${{ env.PROJECT_NAME }}.ipa /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa

      # ---------------- Windows ARM64 ----------------
      - name: Download Windows ARM64 Build
        uses: actions/download-artifact@main
        with:
           name: windowsBuild-arm64
           path: ${{ github.workspace }}/WindowsBuild-arm64

      - name: Pack Windows ARM64 Build
        run: |
          cd "${{ github.workspace }}/WindowsBuild-arm64"
          zip -r /home/runner/${{ env.PROJECT_NAME }}-Windows-arm64.zip .

      # ---------------- Publish ----------------
      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.resolve_tag.outputs.name }}
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          prerelease: true
          files: |
            /home/runner/*.apk
            /home/runner/*.ipa
            /home/runner/*.zip

  # ---------------- Extra Content ----------------
  extra-content:
    needs: Releaser
    permissions:
      contents: write
    uses: ./.github/workflows/extra-content.yml
    with:
      tag: ${{ needs.Releaser.outputs.tag }}
