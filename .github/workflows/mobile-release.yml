name: Mobile + Release
on:
  workflow_dispatch:
    inputs:
      no_erect:
        description: '打包时剔除 Erect 变体难度（省约 255MB 音频资源，包体明显变小）'
        type: boolean
        default: false
      no_extra_base_game:
        description: '剔除全部额外变体难度（Erect / Pico / BF / Collab，不含原版 week 资源）'
        type: boolean
        default: false

permissions:
  contents: write
  discussions: write

env:
  PROJECT_NAME: FrozenEngine
  REPO_PATH: TieGao/FNF-FrozenEngine-Mobile

jobs:
  get-commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit_hash.outputs.COMMIT_HASH }}
      no_erect_flag: ${{ steps.build_flags.outputs.NO_ERECT_FLAG }}
      no_extra_flag: ${{ steps.build_flags.outputs.NO_EXTRA_FLAG }}
    steps:
      - name: Check Repository
        run: |
          echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
          echo "REPO_PATH: ${{ env.REPO_PATH }}"
          if [[ "$GITHUB_REPOSITORY" != "${{ env.REPO_PATH }}" ]]; then
            echo "Doesn't seem to be correct, returning SIGABRT..."
            exit 6
          else
            echo "Seems to be correct..."
          fi

      - name: Get latest commit hash
        id: get_commit_hash
        run: |
          commit_hash=${GITHUB_SHA::7}
          echo "Latest commit hash is $commit_hash"
          echo "::set-output name=COMMIT_HASH::$commit_hash"

      # 把布尔开关翻译成 lime 的 -D 编译参数。
      # Project.xml 里 BASE_GAME_ERECT 定义为 unless="NO_EXTRA_BASE_GAME || NO_BASE_GAME_ERECT"，
      # 所以 NO_EXTRA_BASE_GAME 已经隐含关掉 Erect，不需要再补 NO_BASE_GAME_ERECT。
      - name: Resolve variant flags
        id: build_flags
        run: |
          FLAGS=""
          if [ "${{ inputs.no_erect }}" = "true" ]; then
            FLAGS="-D NO_BASE_GAME_ERECT"
          fi
          if [ "${{ inputs.no_extra_base_game }}" = "true" ]; then
            FLAGS="$FLAGS -D NO_EXTRA_BASE_GAME"
          fi
          echo "Compile flags:$FLAGS"
          echo "::set-output name=NO_ERECT_FLAG::$FLAGS"
          echo "::set-output name=NO_EXTRA_FLAG::$FLAGS"

  build:
    name: ${{ matrix.name }}
    needs: get-commit-hash
    strategy:
      matrix:
        include:
          - name: Android
            os: macos-latest
            buildArgs: "android -final"
            setupCommand: sh ./setup/unix.sh
            artifactName: androidBuild
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-latest
            setupCommand: sh ./setup/unix.sh
            buildArgs: "ios -final -nosign"
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
    uses: ./.github/workflows/build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        setupCommand: ${{ matrix.setupCommand }}
        buildArgs: ${{ needs.get-commit-hash.outputs.no_erect_flag != '' && format('{0} {1}', matrix.buildArgs, needs.get-commit-hash.outputs.no_erect_flag) || matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}

  Releaser:
    needs: [get-commit-hash, build]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@main
        with:
           name: androidBuild
           path: /home/runner

      - name: Move Android File
        run: mv /home/runner/${{ env.PROJECT_NAME }}-release.apk /home/runner/${{ env.PROJECT_NAME }}-Android.apk

      - name: Download iOS Build
        uses: actions/download-artifact@main
        with:
           name: iOSBuild
           path: ${{ github.workspace }}

      - name: Move iOS File
        run: mv ${{ github.workspace }}/${{ env.PROJECT_NAME }}.ipa /home/runner/${{ env.PROJECT_NAME }}-iOS.ipa

      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DevBuild ${{ needs.get-commit-hash.outputs.commit_hash }}"
          tag_name: "devbuild-${{ needs.get-commit-hash.outputs.commit_hash }}"
          prerelease: true
          files: |
            /home/runner/*.apk
            /home/runner/*.zip
            /home/runner/*.ipa
