name: Desktop Build

# 仅构建、不发布：手动点一下把桌面平台编一遍，产物在 Actions 的 artifact 里。
# 矩阵取自本仓 main.yml 的桌面那几项（去掉 Android / iOS）。
#
# 调的是 cache-build.yml（带编译缓存），不是 build.yml —— release 那条链用的
# build.yml 是干净的、不依赖缓存，别把两者搞混。
#
# 要出 release 走 mobile-release.yml / everything-release.yml。

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-2022
            buildArgs: windows
            setupCommand: .\"setup/windows.bat"
            artifactName: windowsBuild-x86_64
            artifactPath: export\release\windows\bin\*
          - name: Windows ARM64
            os: windows-2022
            buildArgs: "windows -arm64 -D HXCPP_ARM64"
            setupCommand: .\"setup/windows.bat"
            artifactName: windowsBuild-arm64
            artifactPath: export\release\windows\bin\*
          - name: Linux
            os: ubuntu-22.04
            buildArgs: linux
            setupCommand: sh ./setup/unix.sh
            artifactName: linuxBuild-x86_64
            artifactPath: export/release/linux/bin/*
          - name: macOS x86_64
            os: macos-15
            setupCommand: sh ./setup/unix.sh
            buildArgs: "mac -64 -D HXCPP_M64"
            artifactName: macOSBuild-x86_64
            artifactPath: export/release/macos/bin/*
          - name: macOS ARM64
            os: macos-15
            setupCommand: sh ./setup/unix.sh
            buildArgs: "mac -arm64 -D HXCPP_ARM64"
            artifactName: macOSBuild-arm64
            artifactPath: export/release/macos/bin/*
    uses: ./.github/workflows/cache-build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        setupCommand: ${{ matrix.setupCommand }}
        buildArgs: ${{ matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}
