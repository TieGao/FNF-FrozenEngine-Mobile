name: Mobile Build

# 仅构建、不发布：Android + iOS，产物在 Actions 的 artifact 里。
# 矩阵取自本仓 main.yml 的移动那两项。
#
# 调的是 cache-build.yml（带编译缓存），不是 build.yml —— release 那条链用的
# build.yml 是干净的、不依赖缓存，别把两者搞混。
#
# 要出 release 走 mobile-release.yml / everything-release.yml。

on:
  workflow_dispatch:
    inputs:
      dependencies_to_update:
        description: '填 all = 重新校验 / 安装全部 haxelib；留空（默认）= 直接用缓存里的 .haxelib/，跳过安装'
        required: false
        type: string
        default: ''
  # push 到 main 就编一遍（对齐 CNE windows.yml 的 push + workflow_dispatch）：
  # 编译问题当场暴露，不等 schedule；缓存跟着主干保持新鲜。
  push:
    branches:
      - main
  # 每天 06:00 UTC 在默认分支跑一次：既当真·日常构建（只出 Android / iOS），也把缓存
  # 写进默认分支作用域，好让 PR 构建能通过 restore-keys 读到这里预热好的缓存（PR 自身
  # 的缓存存在 refs/pull/N/merge，只有该 PR 的 re-run 能读）。
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Android
            os: macos-latest
            # 对齐 mobile-release.yml 的出包参数。-ONLY_ARMV7 是旧参数，Project.xml
            # 现在写死 <architecture name="arm64" exclude="armv7" if="android" />，
            # 两者互相矛盾，别再用它。
            buildArgs: "android -final"
            setupCommand: sh ./setup/unix.sh
            artifactName: androidBuild
            artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
          - name: iOS
            os: macos-latest
            buildArgs: "ios -final -nosign"
            setupCommand: sh ./setup/unix.sh
            artifactName: iOSBuild
            artifactPath: "export/release/ios/build/Release-iphoneos/*.ipa"
    uses: ./.github/workflows/cache-build.yml
    with:
        name: ${{ matrix.name }}
        os: ${{ matrix.os }}
        setupCommand: ${{ matrix.setupCommand }}
        buildArgs: ${{ matrix.buildArgs }}
        artifactName: ${{ matrix.artifactName }}
        artifactPath: ${{ matrix.artifactPath }}
        dependencies_to_update: ${{ inputs.dependencies_to_update }}
