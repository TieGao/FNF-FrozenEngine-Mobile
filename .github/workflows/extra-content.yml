name: Extra Content Packages

# 仅打包 Extra 内容数据（content/VanillaSongs 下各分类），不打引擎二进制。
# 触发方式：
#   1) workflow_call：由 Main + Release 的 Releaser job 自动调用；
#   2) workflow_dispatch：在 Actions 页面手动触发，需要填已存在的 release tag。
#
# 每个分类一个独立 zip：<PROJECT_NAME>-<分类>-extra.zip
#   Erect / PicoMix / BFMix / Collab
# 分类包只含 content/VanillaSongs/<分类> 的歌曲数据（谱面/音轨/事件/周定义）；
# 舞台类与 pico/bf/collab 视觉资源已在主 base 二进制里（"仅剔除打包数据"约定），不在此重复。

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to upload extra packages to'
        required: true
        type: string
      exclude_base:
        description: '不要 base game（不打包上传 FrozenEngine-mobile-base.zip）'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload extra packages to (must already exist)'
        required: true
        type: string
      exclude_base:
        description: '不要 base game（不打包上传 FrozenEngine-mobile-base.zip）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  PROJECT_NAME: FrozenEngine

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - name: Pack each category
        run: |
          cd "${{ github.workspace }}"
          for cat in Erect PicoMix BFMix Collab; do
            echo "Packing content/VanillaSongs/$cat"
            zip -r "/home/runner/${{ env.PROJECT_NAME }}-${cat}-extra.zip" "content/VanillaSongs/$cat"
          done

      # 移动端导入包（方案B'）：APK 只内嵌基础 assets，原版资源（base_game 摊平进 assets/）
      # 与 CustomCharts 独立成 zip，游戏内 BootDataState"导入数据包 zip"一键导入。
      # 媒体 STORED（免无效压缩）、文本 DEFLATED，与 tools/make_mobile_data_zip.py 同口径。
      # exclude_base=true 时跳过 base 包（升级发版复用旧 release 的数据包，见 mobile-release.yml 同名勾选）。
      - name: Pack mobile customcharts package
        run: |
          cd "${{ github.workspace }}"
          python3 - <<'EOF'
          import os, zipfile
          STORED = {'.ogg','.mp3','.wav','.png','.jpg','.jpeg','.webm','.mp4','.ttf','.otf','.atlas','.webp','.ico','.dll','.ndll','.so'}
          def add_tree(zf, src, arc_root):
              n = 0
              for dp, dn, fn in os.walk(src):
                  for f in sorted(fn):
                      full = os.path.join(dp, f)
                      rel = os.path.relpath(full, src).replace(os.sep, '/')
                      method = zipfile.ZIP_STORED if os.path.splitext(f)[1].lower() in STORED else zipfile.ZIP_DEFLATED
                      zf.write(full, f'{arc_root}/{rel}', compress_type=method)
                      n += 1
              return n
          with zipfile.ZipFile('/home/runner/FrozenEngine-mobile-customcharts.zip', 'w', allowZip64=True) as zf:
              n = add_tree(zf, 'content/CustomCharts', 'content/CustomCharts')
              if os.path.isfile('content/readme.txt'):
                  zf.write('content/readme.txt', 'content/readme.txt'); n += 1
              print(f'FrozenEngine-mobile-customcharts.zip: {n} files')
          EOF

      - name: Pack mobile base package
        if: inputs.exclude_base != true
        run: |
          cd "${{ github.workspace }}"
          python3 - <<'EOF'
          import os, zipfile, sys
          STORED = {'.ogg','.mp3','.wav','.png','.jpg','.jpeg','.webm','.mp4','.ttf','.otf','.atlas','.webp','.ico','.dll','.ndll','.so'}
          def add_tree(zf, src, arc_root):
              n = 0
              for dp, dn, fn in os.walk(src):
                  for f in sorted(fn):
                      full = os.path.join(dp, f)
                      rel = os.path.relpath(full, src).replace(os.sep, '/')
                      method = zipfile.ZIP_STORED if os.path.splitext(f)[1].lower() in STORED else zipfile.ZIP_DEFLATED
                      zf.write(full, f'{arc_root}/{rel}', compress_type=method)
                      n += 1
              return n
          with zipfile.ZipFile('/home/runner/FrozenEngine-mobile-base.zip', 'w', allowZip64=True) as zf:
              n = add_tree(zf, 'assets/base_game', 'assets')
              ok = any(name.startswith('assets/week2/') for name in zf.namelist())
              print(f'FrozenEngine-mobile-base.zip: {n} files, marker {"OK" if ok else "MISSING"}')
              if not ok: sys.exit(1)
          EOF

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: |
            /home/runner/*-extra.zip
            /home/runner/FrozenEngine-mobile-*.zip